AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Composytex CI/CD bootstrap — roles GitHub Actions uses to deploy the site and the
  composytex-admin stack. Deploy once by hand (see infra/README.md); no AWS keys live in GitHub.

Parameters:
  # The repo uses GitHub's immutable OIDC subject (owner@id/repo@id), which survives
  # renames and can't be claimed by a recreated repo. Check with:
  #   gh api repos/ivan-buda-montania/composytex-website/actions/oidc/customization/sub
  GitHubSubjectPrefix:
    Type: String
    Default: repo:ivan-buda-montania@257895885/composytex-website@1397215774
  GitHubEnvironment:
    Type: String
    Default: production
  WebsiteBucket:
    Type: String
    Default: composytex-website
  DistributionId:
    Type: String
    Default: EDLEB3DROGP6X
  AppStackName:
    Type: String
    Default: composytex-admin
  SamArtifactsBucket:
    Type: String
    Default: aws-sam-cli-managed-default-samclisourcebucket-6gegboxpojec

Resources:
  # Assumed by the workflow via OIDC. Can only sync the site and ask CloudFormation
  # (through CfnExecutionRole) to update the app stack.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: composytex-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${WebsiteBucket}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::${WebsiteBucket}/*
              # The catalog and images are owned by /admin — CI must never overwrite them.
              - Effect: Deny
                Action: [s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:aws:s3:::${WebsiteBucket}/data/*
                  - !Sub arn:aws:s3:::${WebsiteBucket}/media/*
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}
        - PolicyName: deploy-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:aws:s3:::${SamArtifactsBucket}/*
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub arn:aws:s3:::${SamArtifactsBucket}
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # Used by CloudFormation to create/update the app stack's resources.
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: composytex-cfn-exec
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-app-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action: [apigateway:GET, apigateway:POST, apigateway:PUT, apigateway:PATCH, apigateway:DELETE]
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
              - Effect: Allow
                Action: cognito-idp:*
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              - Effect: Allow
                Action: cognito-idp:CreateUserPool
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*:*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudfront:CreateFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                  - cloudfront:DeleteFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:function/composytex-spa-rewrite
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${SamArtifactsBucket}/*

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecutionRoleArn:
    Value: !GetAtt CfnExecutionRole.Arn
